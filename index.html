<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1128">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Thermal Report</title>
<style>
:root{--navy:#0A1128;--panel:#101B3D;--blue:#1E6BFF;--cyan:#00E5FF;--mute:#7F93C7;--ok:#2BFFB0;--err:#FF5C7A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100%}
main{max-width:480px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
h1{margin:6px 0 0;text-align:center;font:700 20px Consolas,monospace;color:var(--cyan);letter-spacing:.5px;direction:ltr}
.sub{text-align:center;color:var(--mute);font-size:13px;margin-top:-8px}
input[type=password],input[type=text]{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--blue);background:var(--panel);color:#fff;font-size:15px;direction:ltr}
#drop{border:2px dashed var(--cyan);border-radius:18px;background:var(--panel);min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--cyan);text-align:center;padding:14px;cursor:pointer;box-shadow:0 0 22px rgba(0,229,255,.12) inset}
#drop img{max-width:100%;max-height:260px;border-radius:10px}
#drop.drag{box-shadow:0 0 28px rgba(0,229,255,.45)}
button{border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;color:#fff;cursor:pointer}
#go{background:linear-gradient(90deg,var(--blue),#00B7FF);box-shadow:0 0 18px rgba(0,183,255,.45)}
#go:disabled{opacity:.5}
.row{display:flex;gap:10px}.row button{flex:1}
.ghost{background:transparent;border:2px solid var(--cyan);color:var(--cyan)}
#bar{height:6px;border-radius:6px;background:var(--panel);overflow:hidden;display:none}
#bar i{display:block;height:100%;width:40%;background:var(--cyan);border-radius:6px;animation:mv 1.1s infinite ease-in-out}
@keyframes mv{0%{margin-inline-start:-40%}100%{margin-inline-start:100%}}
#st{text-align:center;font-size:14px;color:var(--mute);min-height:20px;word-break:break-word}
#out{display:none}
</style>
</head>
<body>
<main>
  <h1>IMAGE → THERMAL WORD</h1>
  <div class="sub">تقرير تحليل الجسم • طابعة حرارية 80مم</div>
  <input id="key" type="password" placeholder="Gemini API Key" autocomplete="off">
  <div id="drop"><div id="hint">📷 اضغط لاختيار صورة التقرير<br><small style="color:var(--mute)">من المعرض أو الكاميرا</small></div></div>
  <input id="file" type="file" accept="image/*" hidden>
  <button id="go">Generate Report</button>
  <div id="bar"><i></i></div>
  <div id="st"></div>
  <div id="out" class="row">
    <button id="share" class="ghost">مشاركة / فتح</button>
    <button id="dl" class="ghost">تحميل</button>
  </div>
</main>
<script src="docx.js"></script>
<script src="app.js"></script>
<script>
const $ = id => document.getElementById(id);
let file = null, blob = null, fname = "thermal_report.docx";
$("key").value = localStorage.getItem("gk") || "";
const st = (t, c) => { $("st").textContent = t; $("st").style.color = c || "var(--mute)"; };
function setFile(f){
  if(!f) return; file = f; blob = null; $("out").style.display = "none";
  const url = URL.createObjectURL(f);
  $("drop").innerHTML = `<img src="${url}" alt=""><small style="color:var(--mute)">اضغط لتغيير الصورة</small>`;
  st("جاهز");
}
$("drop").onclick = () => $("file").click();
$("file").onchange = e => setFile(e.target.files[0]);
["dragover","dragenter"].forEach(ev => $("drop").addEventListener(ev, e => {e.preventDefault(); $("drop").classList.add("drag");}));
["dragleave","drop"].forEach(ev => $("drop").addEventListener(ev, e => {e.preventDefault(); $("drop").classList.remove("drag");}));
$("drop").addEventListener("drop", e => setFile(e.dataTransfer.files[0]));

$("go").onclick = async () => {
  const key = $("key").value.trim();
  if(!file) return st("اختار صورة الأول", "var(--err)");
  if(!key) return st("حط مفتاح Gemini API", "var(--err)");
  localStorage.setItem("gk", key);
  $("go").disabled = true; $("bar").style.display = "block"; $("out").style.display = "none";
  try{
    st("بحلل الصورة بالذكاء الاصطناعي…", "var(--cyan)");
    const data = await extractData(file, key);
    st("بجهز ملف الوورد…", "var(--cyan)");
    blob = await makeDocxBlob(data);
    fname = "thermal_report_" + new Date().toISOString().slice(0,16).replace(/[:T]/g,"-") + ".docx";
    st("✔ تم! الملف جاهز", "var(--ok)");
    $("out").style.display = "flex";
  }catch(e){ st("✖ " + e.message, "var(--err)"); }
  $("go").disabled = false; $("bar").style.display = "none";
};
$("dl").onclick = () => {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname; a.click();
};
$("share").onclick = async () => {
  const f = new File([blob], fname, {type: blob.type});
  if(navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f], title: fname}); return; }catch(e){ if(e.name==="AbortError") return; }
  }
  $("dl").click();
};
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
